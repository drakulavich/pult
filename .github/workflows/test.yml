name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The wrapper hunts for bun in Homebrew and Linux Homebrew paths, and the
    # tests exercise those branches, so both platforms are worth the minute.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
